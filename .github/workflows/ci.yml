---
  name: ci

  on:
    pull_request:

  jobs:
    validate:
      runs-on: ubuntu-latest

      steps:
        - name: Check out code
          uses: actions/checkout@main
        - name: Validate snippet JSON files
          run: |
            for json in `ls snippets/*.json`
            do
              (cat ${json} | jq empty) || (echo "JSON parsing problem with ${json}" && exit 1)
            done
        - name: Render Mermaid architecture diagram
          run: |
            docker run --rm \
              -u "$(id -u):$(id -g)" \
              -v "$PWD":/data \
              minlag/mermaid-cli \
              -i /data/ai-track-docs/architecture.mmd \
              -o /data/ai-track-docs/architecture.ci.svg
            test -s ai-track-docs/architecture.ci.svg
            rm -f ai-track-docs/architecture.ci.svg

    build:
      needs: [validate]
      runs-on: ubuntu-latest
      strategy:
        matrix:
          node-version: [15.x]
      steps:
        - uses: actions/checkout@main
        - name: Use Node.js ${{ matrix.node-version }}
          uses: actions/setup-node@v1
          with:
            node-version: ${{ matrix.node-version }}
        - run: npm install
        - run: npx vsce package
